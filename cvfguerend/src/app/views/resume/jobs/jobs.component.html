<div class='jobDivContainer'>

    <h1 class= 'jobTitle' >{{jobTitleLable}}</h1>

    <div class="jobListContainerDiv">
        <div class= 'jobList' *ngFor="let job of jobList">
            <p>{{job.since}} - {{job.until}}</p>
            <p>{{job.enterprise}}</p>
            <p>{{job.summary}}:</p>
            <p>{{job.description}}</p>
        </div>
   </div>
</div>
