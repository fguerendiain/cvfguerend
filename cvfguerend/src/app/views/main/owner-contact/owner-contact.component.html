<div class="contactContainerDiv">
  <div class="phoneContainer">
    <a href={{phoneNumber}}><img class="icoImg" src={{phoneIcon}} alt=""></a>
  </div>
  
  <div class="emailContainer">
    <a href={{emailAddress}}><img class="icoImg" src={{emailIcon}} alt=""></a>
  </div>
  
  <div class="linkContainer">
      <a *ngFor="let link of links" href={{link.url}}><img class="icoImg" src={{link.icon}} alt=""></a>
  </div>
</div>
